<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" style="color: var(--accent); font-size: 0.85rem; text-decoration: none; font-weight: 600;">← Back to Team Overview</a>
    <h1 id="member-name" style="margin-top: 12px;">Loading...</h1>
    <p id="member-status" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
  </header>

  <main class="container" id="profile-container">
    <!-- Populated dynamically via JavaScript -->
  </main>

  <footer style="text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 24px; opacity: 0.7;">
    Internal team use only • Performance Profile
  </footer>

  <script src="data.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const memberId = parseInt(urlParams.get('id'), 10);
      
      const container = document.getElementById('profile-container');

      if (isNaN(memberId) || !TEAM_DATA || !TEAM_DATA[memberId]) {
        document.getElementById('member-name').innerText = "Member Not Found";
        document.getElementById('member-status').innerText = "";
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">The requested team member profile does not exist.</p>`;
        return;
      }

      const member = TEAM_DATA[memberId];

      document.title = `${member.name} — Profile`;
      document.getElementById('member-name').innerText = member.name;
      document.getElementById('member-status').innerText = `Target Deadline: 01 February 2027`;

      function timeToSeconds(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      }

      function generateSVGChart(history, isTime = false) {
        if (!history || history.length === 0) return '';

        const cycles = ["Cycle 1", "Cycle 2", "Cycle 3", "Cycle 4", "Cycle 5", "Cycle 6", "Cycle 7"];
        const width = 300;
        const height = 85;
        const padding = 24;

        const validHistory = history.filter(h => h.value !== undefined && h.value !== "" && h.value !== "0:00");
        if (validHistory.length === 0) return '';

        const allVals = validHistory.map(h => isTime ? timeToSeconds(h.value) : h.value);
        const minVal = Math.min(...allVals);
        const maxVal = Math.max(...allVals);
        const range = (maxVal - minVal) || 1;

        const points = cycles.map((cp, i) => {
          const x = padding + (i / (cycles.length - 1)) * (width - padding * 2);
          const histItem = validHistory.find(h => h.cp === cp);
          const histVal = histItem ? (isTime ? timeToSeconds(histItem.value) : histItem.value) : null;
          return { x, cp, histVal, histLabel: histItem ? histItem.value : null };
        });

        const activePoints = points.filter(p => p.histVal !== null);
        const histPolyline = activePoints.map(p => {
          const normalized = isTime ? (maxVal - p.histVal) / range : (p.histVal - minVal) / range;
          const y = height - padding - (normalized * (height - padding * 2));
          return `${p.x},${y}`;
        }).join(' ');

        const histCircles = activePoints.map(p => {
          const normalized = isTime ? (maxVal - p.histVal) / range : (p.histVal - minVal) / range;
          const y = height - padding - (normalized * (height - padding * 2));
          return `
            <circle cx="${p.x}" cy="${y}" r="4" fill="#38bdf8" />
            <text x="${p.x}" y="${y - 9}" fill="#38bdf8" font-size="7.5" text-anchor="middle" font-weight="700">${p.cp}</text>
            <text x="${p.x}" y="${y + 16}" fill="#f8fafc" font-size="8" text-anchor="middle" font-weight="600">${p.histLabel}</text>
          `;
        }).join('');

        return `
          <svg viewBox="0 0 ${width} ${height}" style="width: 100%; height: auto; overflow: visible; margin: 4px 0;">
            <polyline fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${histPolyline}" />
            ${histCircles}
          </svg>
        `;
      }

      const benchChart = generateSVGChart(member.benchHistory, false);
      const mileChart = generateSVGChart(member.mileHistory, true);
      const goalsHTML = member.academicGoals.map(g => `<li>${g}</li>`).join('');

      // Preset Cycle Schedule (15th and 30th)
      const presetCycles = [
        { cp: "Cycle 1", scheduleDate: "Oct 30, 2026" },
        { cp: "Cycle 2", scheduleDate: "Nov 15, 2026" },
        { cp: "Cycle 3", scheduleDate: "Nov 30, 2026" },
        { cp: "Cycle 4", scheduleDate: "Dec 15, 2026" },
        { cp: "Cycle 5", scheduleDate: "Dec 30, 2026" },
        { cp: "Cycle 6", scheduleDate: "Jan 15, 2027" },
        { cp: "Cycle 7", scheduleDate: "Jan 30, 2027" }
      ];

      function buildGridRows(history, milestones, unit = "") {
        return presetCycles.map(item => {
          const recorded = history.find(h => h.cp === item.cp && h.value !== undefined && h.value !== "");
          const milestone = milestones.find(m => m.cp === item.cp);

          const leftHTML = `
            <div>
              <strong style="color: var(--text-main);">${item.cp}</strong> 
              <span style="font-size: 0.75rem; color: var(--accent);">(${item.scheduleDate})</span>
            </div>
          `;

          let middleHTML = `<span style="color: var(--text-muted); font-size: 0.8rem;">—</span>`;
          if (recorded) {
            const dateTag = recorded.verifiedDate ? `<span style="font-size: 0.65rem; color: var(--text-muted); margin-left: 6px;">(${recorded.verifiedDate})</span>` : "";
            middleHTML = `<strong style="color: var(--accent); font-size: 0.95rem;">${recorded.value} ${unit}</strong> ${dateTag}`;
          }

          let rightHTML = `<span style="color: var(--text-muted); font-size: 0.8rem;">—</span>`;
          if (milestone && milestone.target !== undefined) {
            rightHTML = `<span style="color: #f43f5e; font-weight: 700; font-size: 0.85rem;">Target: ${milestone.target} ${unit}</span>`;
          }

          return `
            <div style="display: grid; grid-template-columns: 1.2fr 1.2fr 1.1fr; align-items: center; background: rgba(15, 23, 42, 0.5); padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem;">
              <div>${leftHTML}</div>
              <div style="text-align: center;">${middleHTML}</div>
              <div style="text-align: right;">${rightHTML}</div>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = `
        <!-- BENCH PRESS SECTION -->
        <article class="member-card">
          <div class="goals-title" style="margin-bottom: 8px;">Bench Press Progression</div>
          ${benchChart}
          
          <div style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; padding: 0 4px;">
              <span>Cycle / Date</span>
              <span style="text-align: center;">Logged Stat</span>
              <span style="text-align: right;">Monthly Target</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              ${buildGridRows(member.benchHistory, member.benchMilestones, "LBS")}
            </div>
          </div>
        </article>

        <!-- MILE TIME SECTION -->
        <article class="member-card">
          <div class="goals-title" style="margin-bottom: 8px;">Mile Time Progression</div>
          ${mileChart}

          <div style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; padding: 0 4px;">
              <span>Cycle / Date</span>
              <span style="text-align: center;">Logged Stat</span>
              <span style="text-align: right;">Monthly Target</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              ${buildGridRows(member.mileHistory, member.mileMilestones, "")}
            </div>
          </div>
        </article>

        <!-- ACADEMIC GOALS SECTION -->
        <article class="member-card">
          <div class="goals-title" style="margin-bottom: 8px;">Academic Goals</div>
          <ul class="goals-list">
            ${goalsHTML}
          </ul>
        </article>
      `;
    });
  </script>
</body>
</html>
